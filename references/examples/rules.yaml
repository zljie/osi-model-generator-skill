## 3. 风险控制（risk）

### 3.1 价格超市场价预警

```yaml
- id: "dtp/rule_price_exceeds_market"
  name: "价格超市场价预警"
  description: "采购单价超过系统参考价一定比例时触发预警"
  severity: "warn"
  when:
    entity: "action"
    applies_to:
      action_id: "pr/create"
  constraint:
    type: "risk"
    recommendation: "采购价格超过市场参考价20%，建议重新询价"
    requires:
      - "purchase_requisition_items.unit_price <= market_reference_price * 1.2"
  ai_context:
    - "该物料的采购价格显著高于市场参考价，请确认是否需要重新询价"
    - "价格偏离市场价20%以上"
    - "Price exceeds market reference by more than 20%"
  references:
    - { title: "价格审计政策", url: "/docs/price-audit" }
  label: ["procurement", "price", "risk", "market-comparison"]
```

### 3.2 单一供应商依赖预警

```yaml
- id: "dtp/rule_single_vendor_dependency"
  name: "单一供应商依赖预警"
  description: "某类物料近半年单一供应商采购占比超过80%时预警"
  severity: "warn"
  when:
    entity: "dataset"
    selectors:
      dataset: "purchase_orders"
  constraint:
    type: "risk"
    recommendation: "该物料类别对单一供应商依赖度过高，建议发展备选供应商"
  ai_context:
    - "近半年该物料类别80%以上采购来自同一供应商，存在供应链风险"
    - "单一供应商依赖度过高"
    - "High dependency on single vendor detected"
  label: ["procurement", "supply-chain", "risk", "diversification"]
```

