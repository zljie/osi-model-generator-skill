## 4. 业务策略（policy）

### 4.1 利库优先策略

```yaml
- id: "dtp/rule_prefer_stock_first"
  name: "利库优先策略"
  description: "采购申请时系统应优先推荐现有库存，而非直接采购"
  severity: "info"
  when:
    entity: "action"
    applies_to:
      action_id: "pr/create"
  constraint:
    type: "policy"
    recommendation: "建议先查询现有库存，确认无合适库存后再创建采购申请"
  ai_context:
    - "系统检测到库存中存在相同或可替代物料，建议优先利库"
    - "库存中有可用物料"
    - "Stock availability detected, consider using existing inventory first"
  references:
    - { title: "库存管理政策", url: "/docs/inventory-policy" }
  label: ["procurement", "policy", "stock-first"]
```

---

## 5. 内部控制（control）

### 5.1 收货超允差控制

```yaml
- id: "dtp/rule_receiving_over_tolerance"
  name: "收货超允差控制"
  description: "实际收货数量超过订单数量+允差比例时需特批"
  severity: "error"
  when:
    entity: "action"
    applies_to:
      action_id: "gr/post"
  constraint:
    type: "control"
    requires:
      - "goods_receipts.quantity <= purchase_order_items.quantity * (1 + tolerance_percentage)"
  ai_context:
    - "收货数量超过订单允许的允差范围，需要特批才能过账"
    - "超出允差范围"
    - "Quantity exceeds tolerance limit"
  references:
    - { title: "收货允差标准", url: "/docs/receiving-tolerance" }
  label: ["procurement", "control", "receiving", "tolerance"]
```

### 5.2 金额超额控制

```yaml
- id: "dtp/rule_amount_exceeds_po"
  name: "到票金额超额控制"
  description: "到票金额（含税）不能超过采购订单金额的105%"
  severity: "error"
  when:
    entity: "dataset"
    selectors:
      dataset: "goods_receipts"
      field_names: ["invoice_amount"]
  constraint:
    type: "control"
    requires:
      - "goods_receipts.invoice_amount_tax_included <= purchase_orders.total_amount * 1.05"
    refers_to: "purchase_orders.total_amount"
  ai_context:
    - "到票金额超过订单金额105%的上限，不允许过账"
    - "发票金额超出允许范围"
    - "Invoice amount exceeds PO limit by more than 5%"
  label: ["procurement", "control", "invoice", "amount-limit"]
```

