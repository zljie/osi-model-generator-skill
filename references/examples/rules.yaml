# OSI Behavior Layer v0.2 — Rules 示例

> 配套规范：[../behavior-layer.md](../behavior-layer.md) | [../behavior-layer.schema.json](../behavior-layer.schema.json)

---

## 1. 合规性约束（compliance）

### 1.1 无申请不下单

```yaml
- id: "dtp/rule_no_po_without_approved_pr"
  name: "无申请不下单"
  description: "采购订单必须关联已批准的采购申请，确保端到端可追溯"
  severity: "error"
  when:
    entity: "action"
    applies_to:
      action_id: "po/release"
  constraint:
    type: "compliance"
    requires:
      - "purchase_orders.pr_id IS NOT NULL"
      - "purchase_requisitions.status = 'APPROVED'"
  ai_context:
    - "采购订单必须关联已审批通过的采购申请，禁止无申请直接下单"
    - "未找到关联的已审批采购申请"
    - "Order must be linked to an approved PR"
  references:
    - { title: "采购管理制度", url: "/docs/procurement-policy" }
    - { title: "端到端流程说明", url: "/docs/pr-to-po-flow" }
  label: ["procurement", "compliance", "pr-po-linkage"]
```

### 1.2 紧急采购必须附说明

```yaml
- id: "dtp/rule_emergency_requires_note"
  name: "紧急采购必须附说明"
  description: "标记为紧急的采购申请必须填写紧急原因说明"
  severity: "error"
  when:
    entity: "action"
    applies_to:
      action_id: "pr/create"
  if:
    all_of:
      - { field: "purchase_requisitions.emergency_flag", equals: true }
  constraint:
    type: "compliance"
    requires:
      - "purchase_requisitions.notes IS NOT NULL"
      - "LENGTH(purchase_requisitions.notes) >= 10"
  ai_context:
    - "紧急采购必须填写原因说明，紧急原因不能为空或过短"
    - "请填写紧急采购的具体原因"
    - "Emergency procurement requires a detailed note"
  references:
    - { title: "紧急采购流程", url: "/docs/emergency-procurement" }
  label: ["procurement", "emergency", "compliance"]
```

