## 6. 命名规范（naming）

### 6.1 申请人ID格式规范

```yaml
- id: "dtp/rule_requester_id_format"
  name: "申请人ID格式规范"
  description: "申请人ID必须符合企业工号格式"
  severity: "error"
  when:
    entity: "field"
    selectors:
      dataset: "purchase_requisitions"
      field_names: ["requester_id"]
  constraint:
    type: "naming"
    pattern: "^[A-Z]{2}\\d{6}$"
    description: "工号格式：2个大写字母 + 6位数字，如"EMP001234""
  ai_context:
    - "申请人ID格式不正确，应为2位大写字母+6位数字"
    - "员工编号格式错误"
    - "Employee ID format is incorrect"
  label: ["procurement", "naming", "format", "employee-id"]
```

---

## 7. 质量要求（quality）

### 7.1 采购申请行项目必填校验

```yaml
- id: "dtp/rule_pr_item_required_fields"
  name: "采购申请行项目必填校验"
  description: "采购申请行项目物料、数量、期望价格必填"
  severity: "error"
  when:
    entity: "field"
    selectors:
      dataset: "purchase_requisition_items"
      field_names: ["material_id", "quantity", "expected_price"]
  constraint:
    type: "quality"
    requires:
      - "purchase_requisition_items.material_id IS NOT NULL"
      - "purchase_requisition_items.quantity > 0"
      - "purchase_requisition_items.expected_price > 0"
  ai_context:
    - "采购申请明细行缺少必填字段，无法提交"
    - "物料编码、数量或期望价格不能为空"
    - "Required fields are missing in line item"
  label: ["procurement", "quality", "required-fields"]
```

---

## 8. 安全约束（security）

### 8.1 供应商银行信息脱敏

```yaml
- id: "dtp/rule_vendor_bank_info_protected"
  name: "供应商银行信息保护"
  description: "供应商银行账户信息为敏感字段，仅财务角色可见"
  severity: "error"
  when:
    entity: "dataset"
    selectors:
      dataset: "vendors"
      field_names: ["bank_account", "bank_routing_number"]
  constraint:
    type: "security"
    forbidden:
      - "SELECT bank_account WHERE user_role != 'FINANCE'"
  ai_context:
    - "该字段为敏感信息，您的角色无权限访问"
    - "银行账户信息仅财务人员可见"
    - "This field is restricted to Finance role only"
  label: ["security", "pii", "finance-data"]
```

---

## 9. 过滤约束（filter）

### 9.1 仅统计已审批数据

```yaml
- id: "dtp/rule_report_only_approved"
  name: "报表仅包含已审批数据"
  description: "采购相关报表默认仅统计状态为已审批的数据"
  severity: "info"
  when:
    entity: "metric"
    selectors:
      metric_names: ["pr_total_amount", "po_total_amount", "delivery_on_time_rate"]
  constraint:
    type: "filter"
    recommendation: "默认过滤条件：仅统计 status = 'APPROVED' 的记录"
  ai_context:
    - "报表默认过滤条件：仅统计已审批通过的采购申请和订单"
    - "默认仅显示已审批数据"
    - "Reports filter to show only approved records by default"
  label: ["procurement", "filter", "report", "default-condition"]
```

---

## 10. 表达式约束（expression）

### 10.1 禁止在明细行使用聚合函数

```yaml
- id: "dtp/rule_no_aggregate_in_line_items"
  name: "明细行禁止聚合"
  description: "采购申请明细行不允许出现聚合函数"
  severity: "error"
  when:
    entity: "field"
    selectors:
      dataset: "purchase_requisition_items"
      field_names: ["quantity", "expected_price"]
  constraint:
    type: "expression"
    forbidden:
      - "SUM(quantity)"
      - "AVG(quantity)"
      - "COUNT(*)"
      - "MAX(quantity)"
      - "MIN(quantity)"
  ai_context:
    - "明细行字段不允许使用聚合函数，请使用明细数值"
    - "不允许在明细行使用聚合"
    - "Aggregate functions are not allowed in line items"
  label: ["procurement", "expression", "validation"]
```
