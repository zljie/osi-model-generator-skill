## 2. 治理约束（governance）

### 2.1 金额超限需二级审批

```yaml
- id: "dtp/rule_high_value_requires_second_approval"
  name: "金额超限需二级审批"
  description: "超过预算阈值的采购申请需要二级审批才能下达订单"
  severity: "warn"
  when:
    entity: "action"
    applies_to:
      action_id: "po/release"
  if:
    any_of:
      - { field: "purchase_orders.amount", gt: 50000 }
      - { field: "purchase_orders.amount", gt: "{user.department_budget_limit}" }
  constraint:
    type: "governance"
    recommendation: "建议金额超过5万元的采购申请增加财务总监二级审批"
    requires:
      - "purchase_orders.approval_level >= 2"
  ai_context:
    - "该订单金额较大，系统建议进行二级审批以加强内部控制"
    - "高金额订单需要二级审批"
    - "High-value order requires second-level approval"
  references:
    - { title: "预算审批权限表", url: "/docs/approval-matrix" }
  label: ["procurement", "governance", "high-value", "segregation-of-duties"]
```

### 2.2 供应商必须已准入

```yaml
- id: "dtp/rule_vendor_must_be_approved"
  name: "供应商必须已准入"
  description: "只有状态为ACTIVE的供应商才能参与采购"
  severity: "error"
  when:
    entity: "action"
    applies_to:
      action_id: "po/release"
  constraint:
    type: "governance"
    requires:
      - "vendors.status = 'ACTIVE'"
      - "vendors.approval_date IS NOT NULL"
  ai_context:
    - "该供应商尚未完成准入审批或已被禁用，无法向其下达订单"
    - "供应商状态不可用"
    - "Vendor is not approved or has been disabled"
  references:
    - { title: "供应商管理流程", url: "/docs/vendor-management" }
  label: ["procurement", "vendor", "governance"]
```

