    metrics:
      - name: pr_to_po_avg_cycle_days
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                AVG(
                  DATEDIFF(
                    purchase_requisitions.created_at,
                    purchase_orders.created_at
                  )
                )
        description: PR转PO平均周期（天）；按 PR行项→PO行项 关联后，比较 PR创建时间与 PO创建时间

      - name: emergency_pr_ratio
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                SUM(CASE WHEN purchase_requisitions.emergency_flag = TRUE OR purchase_requisitions.status = 'URGENT' THEN 1 ELSE 0 END)
                / NULLIF(COUNT(*), 0)
        description: 紧急采购比例（以 PR.emergency_flag=true 或 PR.status='URGENT' 作为占位判定，可按实际字段调整）

      - name: demand_forecast_accuracy
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                1
                - (
                  SUM(ABS(demand_plans.forecast_qty - demand_plans.actual_consumption_qty))
                  / NULLIF(SUM(demand_plans.actual_consumption_qty), 0)
                )
        description: 需求预测准确率（占位口径：1 - |预测-实际|/实际；可按你们定义替换）

      - name: balancing_transfer_ratio
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                SUM(balancing_results.transfer_suggestion_qty)
                / NULLIF(SUM(balancing_results.transfer_suggestion_qty + balancing_results.net_requirement_qty), 0)
        description: 平衡利库后调入量占比（调入建议量 /（调入建议量 + 净需求量））

      - name: centralized_procurement_coverage
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                SUM(CASE WHEN purchase_orders.is_centralized = TRUE THEN purchase_orders.total_amount ELSE 0 END)
                / NULLIF(SUM(purchase_orders.total_amount), 0)
        description: 集采覆盖率（集中采购金额 / 采购总金额）

      - name: contract_order_ratio
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                SUM(CASE WHEN purchase_orders.contract_id IS NOT NULL THEN purchase_orders.total_amount ELSE 0 END)
                / NULLIF(SUM(purchase_orders.total_amount), 0)
        description: 框架协议下单比例（合同关联订单金额 / 采购总金额）

      - name: po_on_time_delivery_rate
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: |
                SUM(
                  CASE
                    WHEN goods_receipts.posted_at <= purchase_order_items.delivery_date THEN 1
                    ELSE 0
                  END
                )
                / NULLIF(COUNT(*), 0)
        description: PO准时交付率（占位：以收货过账时间<=交货日期判定，按PO行项口径）

    behavior:
      namespace: "DTP"
      behavior_layer_version: "0.2"
      metadata:
        scope: "Demand-to-Procurement (LTR + PTR)"
        source_materials: ["EA分析结果1.md", "企业分析推论1.md", "DTP流程图.png"]
      actions:
        - id: demand/capture
          name: 采集需求（DemandCaptured）
          kind: command
          operation: create
          entity_name: demand_requests
          description: 业务部门/项目提交物料与服务需求，进入需求池
          io_schema:
            input_schema:
              type: object
              additionalProperties: false
              required: [requester_org_unit_id, material_id, demand_qty, required_date]
              properties:
                requester_org_unit_id: { type: string }
                material_id: { type: string }
                demand_qty: { type: number }
                required_date: { type: string }
                priority: { type: string }
          ai_context:
            - "我要提交一个物料需求"
            - "业务部门发起采购申请"
            - "创建需求单"

        - id: plan/generate_demand_plan
          name: 生成需求计划（需求聚合/计划编制）
          kind: query
          operation: derive
          entity_name: demand_plans
          description: 汇总同类需求，形成计划周期内可执行的需求计划
          ai_context:
            - "运行需求计划生成"
            - "汇总本月物料需求"

        - id: balancing/run
          name: 运行平衡利库（BalancingCompleted）
          kind: query
          operation: derive
          entity_name: balancing_results
          description: 优先本厂库存、其次集团调拨、最后形成净需求；可输出替代建议
          ai_context:
            - "执行利库计算"
            - "检查库存可用性"
            - "是否有调拨建议"

        - id: pr/create
          name: 创建采购申请（参考创建/独立创建）
          kind: command
          operation: create
          entity_name: purchase_requisitions
          description: 从需求计划/利库结果参考创建PR，或由需求方独立创建PR（紧急/零星）
          ai_context:
            - "创建采购申请单"
            - "发起PR"
            - "提交采购需求"

        - id: pr/approve
          name: 审批采购申请
          kind: command
          operation: approve
          entity_name: purchase_requisitions
          ai_context:
            - "审批采购申请"
            - "通过PR"
            - "同意采购需求"

        - id: po/create
          name: 创建采购订单（集中/独立/参考创建）
          kind: command
          operation: create
          entity_name: purchase_orders
          description: 聚合同类PR形成集采PO，或单PR转PO；可从框架协议带出价格条款
          ai_context:
            - "创建采购订单"
            - "下达PO"
            - "向供应商下单"

        - id: po/release
          name: 下达订单给供应商（OrderDispatchedToSupplier）
          kind: command
          operation: release
          entity_name: purchase_orders
          ai_context:
            - "释放/下达采购订单"
            - "发送订单给供应商"

        - id: gr/post
          name: 收货过账（GoodsReceiptPosted）
          kind: command
          operation: post
          entity_name: goods_receipts
          description: 根据有效PO执行到货登记、质检、生成收货凭证并联动库存与应付暂估
          ai_context:
            - "执行收货过账"
            - "物料到货入库"
            - "确认收货"

      rules:
        - id: dtp/rule_no_po_without_approved_pr
          name: 无申请不下单（PR审批通过前禁止创建PO）
          severity: error
          when: { entity: action, applies_to: { action_id: po/create } }
          constraint: { type: compliance, requires: ["purchase_requisitions.status='Approved'"] }
          ai_context: "采购订单必须来源于已审批通过的采购申请，严禁无申请下单。"
          remediation: "先创建并审批PR（pr/create + pr/approve），再执行 po/create。"
          labels: [合规, 采购流程]

        - id: dtp/rule_gr_requires_released_po
          name: 无有效PO不收货（仅允许对已下达/确认PO收货）
          severity: error
          when: { entity: action, applies_to: { action_id: gr/post } }
          constraint: { type: compliance, requires: ["purchase_orders.status IN ('Released','Confirmed')"] }
          ai_context: "收货必须以有效的采购订单为凭证，不允许无单到货。"
          remediation: "先下达PO（po/create + po/release）并确保状态有效，再收货过账。"
          labels: [合规, 收货流程]

        - id: dtp/rule_budget_check_required
          name: 预算校验必过（PR必须通过预算控制）
          severity: error
          when: { entity: dataset, selectors: { dataset: purchase_requisitions } }
          constraint: { type: governance, equals: "Pass" }
          ai_context: "采购申请必须校验预算可用额度，未通过预算校验不得进入审批与下单。"
          remediation: "补充预算/调整科目或拆分申请后重新提交。"
          labels: [治理, 预算控制]

        - id: dtp/rule_supplier_must_be_qualified
          name: 供应商准入门禁（未准入或阻断供应商不可交易）
          severity: error
          when: { entity: dataset, selectors: { dataset: suppliers } }
          constraint: { type: risk, requires: ["suppliers.qualification_status='Approved'", "suppliers.status<>'Blocked'"] }
          ai_context: "供应商未准入或处于阻断状态时，不得被推荐或用于下单。"
          remediation: "先走供应商准入/解冻流程，或选择其他合规供应商。"
          labels: [风险控制, 供应商管理]

        - id: dtp/rule_balancing_before_purchase
          name: 利库优先（能利库不新购）
          severity: warn
          when: { entity: action, applies_to: { action_id: pr/create } }
          constraint: { type: policy, recommendation: "优先引用 balancing_results.recommended_action='transfer' 的调拨建议" }
          ai_context: "业务原则要求优先平衡利库：优先本厂库存，其次集团调拨，最后生成净需求再采购。"
          remediation: "先执行 balancing/run，并在PR中标记参考创建来源（derived_from_balancing_id）。"
          labels: [策略, 库存优化]

        - id: dtp/rule_gr_qty_tolerance
          name: 收货超允差需审批
          severity: warn
          when: { entity: action, applies_to: { action_id: gr/post } }
          constraint: { type: control, refers_to: "purchase_order_items.delivery_tolerance_pct" }
          ai_context: "收货数量超PO允差/超额应触发例外审批与复核。"
          remediation: "走BPM例外审批后再过账，或拆分/更正PO行项允差。"
          labels: [控制, 收货管理]
