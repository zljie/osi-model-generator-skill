version: "0.1.2"

semantic_model:
  - name: dtp_procurement
    description: 需求到采购（DTP, Demand-to-Procurement）端到端业务对象图谱与指标/规则/动作闭环语义模型
    ai_context:
      instructions: |
        默认口径（可按你们实际ERP/SRM/WMS字段调整）：
        1) PR→PO周期：从采购申请创建时间到对应采购订单创建时间（按行项关联）。
        2) 紧急采购：以 PR.emergency_flag=true 或 PR.priority='URGENT' 判定（如只保留其一请删改）。
        3) 集采覆盖：以 PO.is_centralized=true 判定；框架协议下单：以 PO.contract_id 非空判定。
        4) 合规硬约束：无申请不下单、无有效PO不收货、预算校验必过、供应商需准入。
        注意：source 物理表名与字段为“占位映射”，用于先跑通本体结构；落地时请替换为真实库表与字段。
      synonyms:
        - DTP
        - 需求到采购
        - 采购端到端
      examples:
        - "本月PR转PO平均周期是多少？按工厂分组。"
        - "紧急采购比例是多少？哪些物料/部门最高？"
        - "集采覆盖率和框架协议下单比例是否达标？"
        - "利库调入占比是否≥30%？哪些工厂需要优化？"
        - "有哪些收货超允差或无单到货风险？"

    datasets:
      - name: materials
        source: mdm.public.materials
        primary_key: [material_id]
        description: 物料主数据（编码、品类、单位等）
        ai_context:
          synonyms: ["物料", "物料主数据", "Material"]
        fields:
          - name: material_id
            description: 物料ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: materials.material_id }] }
          - name: material_code
            description: 物料编码
            expression: { dialects: [{ dialect: ANSI_SQL, expression: materials.material_code }] }
          - name: material_name
            description: 物料名称
            expression: { dialects: [{ dialect: ANSI_SQL, expression: materials.material_name }] }
          - name: material_group
            description: 物料组/品类
            expression: { dialects: [{ dialect: ANSI_SQL, expression: materials.material_group }] }
          - name: base_uom
            description: 基本计量单位
            expression: { dialects: [{ dialect: ANSI_SQL, expression: materials.base_uom }] }

      - name: suppliers
        source: mdm.public.suppliers
        primary_key: [supplier_id]
        description: 供应商主数据（准入、状态、结算信息等）
        ai_context:
          synonyms: ["供应商", "供应商主数据", "Vendor", "Supplier"]
        fields:
          - name: supplier_id
            description: 供应商ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: suppliers.supplier_id }] }
          - name: supplier_code
            description: 供应商编码
            expression: { dialects: [{ dialect: ANSI_SQL, expression: suppliers.supplier_code }] }
          - name: supplier_name
            description: 供应商名称
            expression: { dialects: [{ dialect: ANSI_SQL, expression: suppliers.supplier_name }] }
          - name: status
            description: 供应商状态（如 Active/Blocked）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: suppliers.status }] }
          - name: qualification_status
            description: 准入状态（如 Approved/Pending/Rejected）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: suppliers.qualification_status }] }

      - name: org_units
        source: mdm.public.org_units
        primary_key: [org_unit_id]
        description: 组织主数据（公司/工厂/仓库/采购组织/成本中心等统一抽象）
        ai_context:
          synonyms: ["组织", "工厂", "仓库", "采购组织", "Org Unit"]
        fields:
          - name: org_unit_id
            description: 组织单元ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: org_units.org_unit_id }] }
          - name: org_unit_type
            description: 组织类型（Company/Plant/Warehouse/PurchasingOrg/...）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: org_units.org_unit_type }] }
          - name: org_unit_code
            description: 组织编码
            expression: { dialects: [{ dialect: ANSI_SQL, expression: org_units.org_unit_code }] }
          - name: org_unit_name
            description: 组织名称
            expression: { dialects: [{ dialect: ANSI_SQL, expression: org_units.org_unit_name }] }

      - name: demand_requests
        source: erp.public.demand_requests
        primary_key: [demand_id]
        description: 需求采集/需求提出（LTR入口：DemandCaptured）
        ai_context:
          synonyms: ["需求采集", "需求提出", "需求申请（业务侧）", "Demand"]
        fields:
          - name: demand_id
            description: 需求ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_requests.demand_id }] }
          - name: requester_org_unit_id
            description: 需求方组织（部门/工厂/项目）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_requests.requester_org_unit_id }] }
          - name: material_id
            description: 需求物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_requests.material_id }] }
          - name: demand_qty
            description: 需求数量
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_requests.demand_qty }] }
          - name: required_date
            description: 需求日期
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_requests.required_date }] }
            dimension: { is_time: true }
          - name: priority
            description: 优先级（如 NORMAL/URGENT）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_requests.priority }] }
          - name: created_at
            description: 需求创建时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_requests.created_at }] }
            dimension: { is_time: true }

      - name: demand_plans
        source: aps.public.demand_plans
        primary_key: [plan_id]
        description: 需求计划（聚合预测结果，LTR：需求聚合/计划编制）
        ai_context:
          synonyms: ["需求计划", "Demand Plan", "需求聚合结果"]
        fields:
          - name: plan_id
            description: 需求计划ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_plans.plan_id }] }
          - name: planning_cycle
            description: 计划周期（如 2026-04 月度）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_plans.planning_cycle }] }
          - name: plant_org_unit_id
            description: 需求归属工厂
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_plans.plant_org_unit_id }] }
          - name: material_id
            description: 计划物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_plans.material_id }] }
          - name: required_date
            description: 计划需求日期
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_plans.required_date }] }
            dimension: { is_time: true }
          - name: forecast_qty
            description: 预测数量（用于预测准确率）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_plans.forecast_qty }] }
          - name: actual_consumption_qty
            description: 实际消耗数量（用于回溯/准确率）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: demand_plans.actual_consumption_qty }] }

      - name: balancing_results
        source: aps.public.balancing_results
        primary_key: [balancing_id]
        description: 平衡利库计算结果（BalancingCompleted：净需求/调拨建议/替代建议）
        ai_context:
          synonyms: ["平衡利库", "利库结果", "净需求计算", "Balancing"]
        fields:
          - name: balancing_id
            description: 利库计算ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.balancing_id }] }
          - name: plan_id
            description: 关联需求计划
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.plan_id }] }
          - name: material_id
            description: 物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.material_id }] }
          - name: plant_org_unit_id
            description: 工厂/需求地点
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.plant_org_unit_id }] }
          - name: on_hand_qty
            description: 现存量
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.on_hand_qty }] }
          - name: in_transit_qty
            description: 在途量
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.in_transit_qty }] }
          - name: transfer_suggestion_qty
            description: 调入建议量
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.transfer_suggestion_qty }] }
          - name: net_requirement_qty
            description: 净需求量（利库后需采购/外部供给）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.net_requirement_qty }] }
          - name: recommended_action
            description: 建议动作（transfer/purchase/substitute/none）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.recommended_action }] }
          - name: created_at
            description: 计算时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: balancing_results.created_at }] }
            dimension: { is_time: true }

      - name: purchase_requisitions
        source: erp.public.purchase_requisitions
        primary_key: [pr_id]
        description: 采购申请（PR Header）
        ai_context:
          synonyms: ["采购申请", "PR", "Purchase Requisition"]
        fields:
          - name: pr_id
            description: PR ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.pr_id }] }
          - name: pr_number
            description: PR 单号
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.pr_number }] }
          - name: requester_org_unit_id
            description: 申请组织（部门/工厂/项目）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.requester_org_unit_id }] }
          - name: status
            description: 状态（Draft/Submitted/Approved/Rejected/Closed）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.status }] }
          - name: emergency_flag
            description: 是否紧急采购（true/false）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.emergency_flag }] }
          - name: total_amount
            description: 申请总金额（含税）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.total_amount }] }
          - name: budget_check_status
            description: 预算校验状态（Pass/Fail/Skip）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.budget_check_status }] }
          - name: created_at
            description: 创建时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.created_at }] }
            dimension: { is_time: true }
          - name: approved_at
            description: 审批通过时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisitions.approved_at }] }
            dimension: { is_time: true }

      - name: purchase_requisition_items
        source: erp.public.purchase_requisition_items
        primary_key: [pr_item_id]
        description: 采购申请行项（PR Item）
        ai_context:
          synonyms: ["采购申请行", "PR行项", "Purchase Requisition Item"]
        fields:
          - name: pr_item_id
            description: PR 行项ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.pr_item_id }] }
          - name: pr_id
            description: PR ID（外键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.pr_id }] }
          - name: material_id
            description: 物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.material_id }] }
          - name: quantity
            description: 数量
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.quantity }] }
          - name: required_date
            description: 需求日期
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.required_date }] }
            dimension: { is_time: true }
          - name: suggested_supplier_id
            description: 建议供应商（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.suggested_supplier_id }] }
          - name: derived_from_plan_id
            description: 参考创建来源计划ID（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.derived_from_plan_id }] }
          - name: derived_from_balancing_id
            description: 参考创建来源利库计算ID（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.derived_from_balancing_id }] }
          - name: create_mode
            description: 创建方式（independent/reference）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_requisition_items.create_mode }] }

      - name: framework_agreements
        source: srm.public.framework_agreements
        primary_key: [agreement_id]
        description: 框架协议/合同（含目录价、条款、有效期）
        ai_context:
          synonyms: ["框架协议", "合同", "Agreement", "Contract"]
        fields:
          - name: agreement_id
            description: 协议ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: framework_agreements.agreement_id }] }
          - name: supplier_id
            description: 供应商
            expression: { dialects: [{ dialect: ANSI_SQL, expression: framework_agreements.supplier_id }] }
          - name: material_id
            description: 协议物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: framework_agreements.material_id }] }
          - name: contract_price
            description: 协议价格
            expression: { dialects: [{ dialect: ANSI_SQL, expression: framework_agreements.contract_price }] }
          - name: valid_from
            description: 生效日期
            expression: { dialects: [{ dialect: ANSI_SQL, expression: framework_agreements.valid_from }] }
            dimension: { is_time: true }
          - name: valid_to
            description: 失效日期
            expression: { dialects: [{ dialect: ANSI_SQL, expression: framework_agreements.valid_to }] }
            dimension: { is_time: true }

      - name: purchase_orders
        source: erp.public.purchase_orders
        primary_key: [po_id]
        description: 采购订单（PO Header）
        ai_context:
          synonyms: ["采购订单", "PO", "Purchase Order"]
        fields:
          - name: po_id
            description: PO ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.po_id }] }
          - name: po_number
            description: PO 单号
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.po_number }] }
          - name: supplier_id
            description: 供应商（外键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.supplier_id }] }
          - name: purchasing_org_unit_id
            description: 采购组织
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.purchasing_org_unit_id }] }
          - name: status
            description: 状态（Created/Released/Confirmed/Closed/Cancelled）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.status }] }
          - name: is_centralized
            description: 是否集中采购（true/false）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.is_centralized }] }
          - name: contract_id
            description: 关联框架协议ID（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.contract_id }] }
          - name: total_amount
            description: 订单总金额
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.total_amount }] }
          - name: created_at
            description: 创建时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.created_at }] }
            dimension: { is_time: true }
          - name: released_at
            description: 下达/发送时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_orders.released_at }] }
            dimension: { is_time: true }

      - name: purchase_order_items
        source: erp.public.purchase_order_items
        primary_key: [po_item_id]
        description: 采购订单行项（PO Item）
        ai_context:
          synonyms: ["采购订单行", "PO行项", "Purchase Order Item"]
        fields:
          - name: po_item_id
            description: PO 行项ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.po_item_id }] }
          - name: po_id
            description: PO ID（外键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.po_id }] }
          - name: pr_item_id
            description: 关联PR行项（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.pr_item_id }] }
          - name: material_id
            description: 物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.material_id }] }
          - name: quantity
            description: 采购数量
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.quantity }] }
          - name: unit_price
            description: 含税单价
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.unit_price }] }
          - name: delivery_date
            description: 交货日期
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.delivery_date }] }
            dimension: { is_time: true }
          - name: delivery_tolerance_pct
            description: 收货允差比例（如 0.05 代表±5%）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: purchase_order_items.delivery_tolerance_pct }] }

      - name: goods_receipts
        source: wms.public.goods_receipts
        primary_key: [gr_id]
        description: 收货凭证（GR Header：GoodsReceiptPosted）
        ai_context:
          synonyms: ["收货凭证", "收货单", "GR", "Goods Receipt"]
        fields:
          - name: gr_id
            description: GR ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipts.gr_id }] }
          - name: po_id
            description: 关联PO（可空，合规要求通常不为空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipts.po_id }] }
          - name: warehouse_org_unit_id
            description: 收货仓库
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipts.warehouse_org_unit_id }] }
          - name: status
            description: 状态（Posted/Reversed/Cancelled）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipts.status }] }
          - name: posted_at
            description: 过账/入库时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipts.posted_at }] }
            dimension: { is_time: true }

      - name: goods_receipt_items
        source: wms.public.goods_receipt_items
        primary_key: [gr_item_id]
        description: 收货行项（含质检、批次/序列号等）
        ai_context:
          synonyms: ["收货行", "GR行项", "收货明细"]
        fields:
          - name: gr_item_id
            description: GR 行项ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.gr_item_id }] }
          - name: gr_id
            description: GR ID（外键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.gr_id }] }
          - name: po_item_id
            description: 关联PO行项（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.po_item_id }] }
          - name: material_id
            description: 物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.material_id }] }
          - name: received_qty
            description: 实收数量
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.received_qty }] }
          - name: quality_status
            description: 质检状态（Pass/Fail/Hold/Skip）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.quality_status }] }
          - name: batch_no
            description: 批次号（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.batch_no }] }
          - name: serial_no
            description: 序列号（可空）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: goods_receipt_items.serial_no }] }

      - name: inventory_transactions
        source: erp.public.inventory_transactions
        primary_key: [inv_txn_id]
        description: 存货进销存流水（InventoryUpdated）
        ai_context:
          synonyms: ["库存流水", "进销存", "库存事务", "Inventory Movement"]
        fields:
          - name: inv_txn_id
            description: 库存流水ID（主键）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.inv_txn_id }] }
          - name: material_id
            description: 物料
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.material_id }] }
          - name: warehouse_org_unit_id
            description: 仓库
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.warehouse_org_unit_id }] }
          - name: txn_type
            description: 类型（receipt/issue/transfer）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.txn_type }] }
          - name: qty
            description: 数量（正负代表入/出）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.qty }] }
          - name: amount
            description: 金额
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.amount }] }
          - name: reference_doc_type
            description: 引用单据类型（PR/PO/GR/Transfer/...）
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.reference_doc_type }] }
          - name: reference_doc_id
            description: 引用单据ID
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.reference_doc_id }] }
          - name: txn_time
            description: 发生时间
            expression: { dialects: [{ dialect: ANSI_SQL, expression: inventory_transactions.txn_time }] }
            dimension: { is_time: true }

    relationships:
      - name: demand_requests_to_materials
        from: demand_requests
        to: materials
        from_columns: [material_id]
        to_columns: [material_id]
      - name: demand_requests_to_org_units
        from: demand_requests
        to: org_units
        from_columns: [requester_org_unit_id]
        to_columns: [org_unit_id]

      - name: demand_plans_to_materials
        from: demand_plans
        to: materials
        from_columns: [material_id]
        to_columns: [material_id]
